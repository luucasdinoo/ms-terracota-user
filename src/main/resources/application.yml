spring:
  profiles:
    active: ${SPRING_PROFILE:dev}
  application:
    name: ms-terracota-user
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    url: ${TRC_DB_URL}
    user: ${TRC_DB_USERNAME}
    password: ${TRC_DB_PASSWORD}
    locations:
      - classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /ms-user/

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    br.com.terracota: INFO

trc:
  db:
    url: ${TRC_DB_URL}
    username: ${TRC_DB_USERNAME}
    password: ${TRC_DB_PASSWORD}
    driver-class-name: ${TRC_DB_DRIVER_CLASS_NAME}
  auth:
    jwt:
      secret: ${TRC_JWT_SECRET}
      expiration-time: ${TRC_JWT_EXPIRATION_TIME}